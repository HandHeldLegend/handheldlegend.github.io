<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HHL Config Icons</title>
<link rel="icon" href="app/favicon.svg" type="image/svg+xml">
<style>
  :root { --red:#E23B3B; --yellow:#F4B41A; --blue:#2F6BD8; --green:#23A35A; --lav:#8E7CC3;
          --gray-l:#E9E8EE; --gray-m:#C9C7D3; --gray-d:#6E6B7B; --bg-dark:#121117; --surf-dark:#1B1A22; --bg-light:#F8F7F4; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; font: 14px/1.4 system-ui, sans-serif; background: var(--bg-light); color: #1B1A22; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 32px 0 12px; color: var(--gray-d); text-transform: uppercase; letter-spacing: .06em; }
  p.note { margin: 0; color: var(--gray-d); }
  .row { border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .row.light { background: #fff; color: #1B1A22; border: 1px solid var(--gray-m); }
  .row.dark { background: var(--bg-dark); color: var(--gray-l); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 10px; }
  .row.light .cell:hover { background: var(--gray-l); }
  .row.dark .cell:hover { background: var(--surf-dark); }
  .cell svg { width: 24px; height: 24px; }
  .cell code { font-size: 11px; opacity: .75; text-align: center; word-break: break-all; }
  .sizes { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
  .sizes svg:nth-child(1) { width: 16px; height: 16px; }
  .sizes svg:nth-child(2) { width: 20px; height: 20px; }
  .sizes svg:nth-child(3) { width: 32px; height: 32px; }
  .accent svg { color: var(--lav); }
  .apps { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
  .apps figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .apps figcaption { font-size: 11px; opacity: .75; }
  .apps img { display: block; image-rendering: auto; }
  .mono { background: var(--gray-d); border-radius: 12px; }
  .splash { display: flex; flex-wrap: wrap; gap: 12px; }
  .splash img { height: 180px; width: auto; border-radius: 8px; border: 1px solid var(--gray-m); }
</style>
</head>
<body>
<h1>HHL Gamepad Config: icon QA</h1>
<p class="note">Sprite: <code>ui.svg</code> (24&times;24, 2px stroke, currentColor). App icons generated by <code>tools/make_icons.py</code>.</p>

<h2>UI icons: light</h2>
<div class="row light"><div class="grid" id="grid-light"></div></div>
<h2>UI icons: dark</h2>
<div class="row dark"><div class="grid" id="grid-dark"></div></div>
<h2>Sizes &amp; accent (16 / 20 / 32)</h2>
<div class="row light accent"><div class="grid" id="grid-sizes"></div></div>

<h2>App icons: light</h2>
<div class="row light apps" id="apps-light"></div>
<h2>App icons: dark</h2>
<div class="row dark apps" id="apps-dark"></div>

<h2>iOS splash screens</h2>
<div class="splash" id="splash"></div>

<script>
(async () => {
  const SPRITE = 'ui.svg';
  let ids = [];
  let prefix = SPRITE;
  try {
    // Inline the sprite so <use> works even where external refs are blocked.
    const txt = await (await fetch(SPRITE)).text();
    const holder = document.createElement('div');
    holder.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
    holder.innerHTML = txt;
    document.body.prepend(holder);
    ids = [...holder.querySelectorAll('symbol')].map(s => s.id);
    prefix = '';
  } catch (e) {
    ids = 'gamepad input joystick snapback rgb motion haptics user battery wireless firmware settings arena home back chevron-right chevron-down close menu check warning info help sun moon system download upload refresh external usb unplug save install trash plus minus play stop calibrate sparkle link copy palette sliders dpad trigger bolt'
      .split(' ').map(n => 'i-' + n);
  }
  const icon = id => `<svg aria-hidden="true"><use href="${prefix}#${id}"/></svg>`;
  for (const g of ['grid-light', 'grid-dark']) {
    document.getElementById(g).innerHTML = ids.map(id =>
      `<div class="cell" title="${id}">${icon(id)}<code>${id.replace(/^i-/, '')}</code></div>`).join('');
  }
  document.getElementById('grid-sizes').innerHTML = ids.map(id =>
    `<div class="cell"><div class="sizes">${icon(id)}${icon(id)}${icon(id)}</div><code>${id.replace(/^i-/, '')}</code></div>`).join('');

  const apps = [
    ['app/icon.svg', 'icon.svg', 96], ['app/icon-1024.png', 'icon-1024', 128], ['app/icon-512.png', 'icon-512', 96],
    ['app/icon-192.png', 'icon-192', 64], ['app/icon-96.png', 'icon-96', 48], ['app/icon-48.png', 'icon-48', 48],
    ['app/icon-32.png', 'icon-32', 32], ['app/icon-16.png', 'icon-16', 16], ['app/favicon.svg', 'favicon.svg', 32],
    ['app/maskable-512.png', 'maskable-512', 96], ['app/icon-maskable.svg', 'icon-maskable.svg', 96],
    ['app/monochrome-512.png', 'monochrome-512', 96, 'mono'], ['app/icon-monochrome.svg', 'icon-monochrome.svg', 96, 'mono'],
    ['app/apple-touch-icon.png', 'apple-touch-icon', 90], ['app/mstile-150.png', 'mstile-150', 75],
    ['app/shortcut-update.png', 'shortcut-update', 48], ['app/shortcut-arena.png', 'shortcut-arena', 48],
  ];
  const appHtml = apps.map(([src, name, size, cls]) =>
    `<figure><img src="${src}" width="${size}" height="${size}" alt="HHL Gamepad Config ${name}" class="${cls || ''}"><figcaption>${name}</figcaption></figure>`).join('');
  document.getElementById('apps-light').innerHTML = appHtml;
  document.getElementById('apps-dark').innerHTML = appHtml;

  const splash = ['1290x2796', '1179x2556', '1284x2778', '1170x2532', '750x1334', '2048x2732', '1668x2388', '1640x2360'];
  document.getElementById('splash').innerHTML = splash.map(s =>
    `<figure style="margin:0"><img src="splash/splash-${s}.png" alt="HHL Gamepad Config splash ${s}" loading="lazy"><figcaption style="font-size:11px">${s}</figcaption></figure>`).join('');
})();
</script>
</body>
</html>
