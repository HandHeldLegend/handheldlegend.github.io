  <link rel="alternate" type="text/plain" href="llms.txt" title="LLM guide">

  <!-- Apply the saved theme before first paint (avoids a light/dark flash). Default: dark. -->
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('hhl-config:prefs') || '{}');
        var t = p.theme || 'dark';
        if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
        var light = t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#f8f7f4' : '#121117');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>

  <link rel="stylesheet" href="css/tokens.css">

<body>

    <div class="splash-title"><strong>HHL</strong> Gamepad Config</div>
    <div class="sfc-loader motion-ok" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div class="splash-status">Loading…</div>
  </div>

</body>
